version: "3.8"
services:
  app:
    build: .
    image: voice-calendar-app:local
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - COQUI_TTS_URL=http://coqui-tts:5002
      - WHISPER_URL=http://whisper:9001
      - TOKENS_DB_PATH=/data/tokens.db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - COPILOT_TIMEOUT_MS=${COPILOT_TIMEOUT_MS:-30000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - app-data:/data
    depends_on:
      - whisper
      - coqui-tts
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  whisper:
    # Placeholder image for a Whisper HTTP service. Replace with the server image you choose.
    image: ghcr.io/ggerganov/whisper.cpp:latest
    ports:
      - "9001:9001"

  coqui-tts:
    # Placeholder image for Coqui TTS inference server — build an image that serves chosen model via REST.
    image: coqui/tts:latest
    ports:
      - "5002:5002"

volumes:
  app-data:

